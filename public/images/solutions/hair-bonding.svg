<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFAF7" />
      <stop offset="100%" stop-color="#FBF0CB" />
    </linearGradient>

    <!-- Scalp Base -->
    <linearGradient id="scalpLayer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9E9D9" />
      <stop offset="100%" stop-color="#E5C7AC" />
    </linearGradient>

    <!-- Medical Resin Layer -->
    <linearGradient id="adhesiveResin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F5B041" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#FAD7A0" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#D4AC0D" stop-opacity="0.85" />
    </linearGradient>

    <!-- Hair System Base -->
    <linearGradient id="sysBaseLayer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDFBF7" />
      <stop offset="100%" stop-color="#E8D5C0" />
    </linearGradient>

    <filter id="softShadow4" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#554433" flood-opacity="0.12" />
    </filter>
  </defs>

  <rect width="400" height="280" rx="16" fill="url(#bgGrad4)" />
  <circle cx="200" cy="140" r="110" fill="#FFFFFF" fill-opacity="0.6" />

  <!-- Exploded Multi-Layer Diagram -->
  <g filter="url(#softShadow4)">
    
    <!-- 1. BOTTOM LAYER: Human Scalp Dermis -->
    <g transform="translate(0, 15)">
      <!-- 3D Perspective Slice of Scalp -->
      <path d="M 80 185 L 200 215 L 320 185 L 200 155 Z" fill="url(#scalpLayer)" stroke="#D4BA9E" stroke-width="1.2" />
      <path d="M 80 185 L 80 198 L 200 228 L 200 215 Z" fill="#CCA888" />
      <path d="M 200 215 L 200 228 L 320 198 L 320 185 Z" fill="#BA9575" />
      
      <!-- Microscopic Pores -->
      <g fill="#B08B6B" opacity="0.4">
        <circle cx="160" cy="180" r="1.5" /><circle cx="240" cy="180" r="1.5" />
        <circle cx="190" cy="195" r="1.5" /><circle cx="220" cy="170" r="1.5" />
      </g>
      <text x="50" y="200" font-family="'DM Sans', system-ui, sans-serif" font-size="9" font-weight="700" fill="#886E56">SCALP DERMIS</text>
    </g>

    <!-- 2. MIDDLE LAYER: Hypoallergenic Medical Adhesive Resin Layer -->
    <g transform="translate(0, -10)">
      <path d="M 90 148 L 200 174 L 310 148 L 200 122 Z" fill="url(#adhesiveResin)" stroke="#F39C12" stroke-width="1.2" />
      <path d="M 90 148 L 90 154 L 200 180 L 200 174 Z" fill="#D68910" />
      <path d="M 200 174 L 200 180 L 310 154 L 310 148 Z" fill="#B9770E" />

      <!-- Bonding Adhesion Links (Vertical micro arrows) -->
      <g stroke="#B7950B" stroke-width="1.2" stroke-dasharray="2 2" opacity="0.8">
        <line x1="140" y1="140" x2="140" y2="160" />
        <line x1="180" y1="150" x2="180" y2="170" />
        <line x1="220" y1="150" x2="220" y2="170" />
        <line x1="260" y1="140" x2="260" y2="160" />
      </g>
      <text x="325" y="153" font-family="'DM Sans', system-ui, sans-serif" font-size="9" font-weight="700" fill="#B7950B">MEDICAL BOND</text>
    </g>

    <!-- 3. TOP LAYER: Micro-Lace Hair System Base + Upward Flowing Hair -->
    <g transform="translate(0, -40)">
      <path d="M 80 115 L 200 145 L 320 115 L 200 85 Z" fill="url(#sysBaseLayer)" stroke="#C99716" stroke-width="1.5" />
      <path d="M 80 115 L 80 120 L 200 150 L 200 145 Z" fill="#C9B197" />
      <path d="M 200 145 L 200 150 L 320 120 L 320 115 Z" fill="#B39B82" />

      <!-- Honeycomb Lattice on Top Base -->
      <g stroke="#C99716" stroke-width="0.75" opacity="0.4" fill="none">
        <path d="M 120 110 L 200 130 L 280 110" />
        <path d="M 140 100 L 200 115 L 260 100" />
      </g>

      <!-- Luxurious Hair Strands Emerging Upward -->
      <g stroke="#1A1511" stroke-linecap="round" fill="none">
        <path d="M 130 110 Q 120 75 140 45 Q 160 25 180 20" stroke-width="2.6" />
        <path d="M 150 115 Q 145 70 170 40 Q 195 20 220 16" stroke-width="2.8" />
        <path d="M 170 120 Q 170 65 200 35 Q 225 18 255 18" stroke-width="3" />
        <path d="M 190 124 Q 195 62 225 32 Q 255 18 285 24" stroke-width="3.2" stroke="#36291E" />
        <path d="M 210 124 Q 218 64 248 34 Q 278 20 305 30" stroke-width="3" stroke="#36291E" />
        <path d="M 230 120 Q 240 68 270 38 Q 295 25 315 42" stroke-width="2.8" />
        <path d="M 250 115 Q 262 72 290 45" stroke-width="2.6" />
        <path d="M 270 110 Q 280 78 300 55" stroke-width="2.4" />
      </g>
      <text x="50" y="98" font-family="'DM Sans', system-ui, sans-serif" font-size="9" font-weight="700" fill="#C99716">HAIR SYSTEM BASE</text>
    </g>

  </g>

  <!-- Water-Resistant / Active Shield Icon Badge -->
  <g transform="translate(45, 230)">
    <rect width="145" height="28" rx="8" fill="#FFFFFF" stroke="#E8E2D8" stroke-width="1" filter="url(#softShadow4)" />
    <circle cx="16" cy="14" r="5" fill="#2E7D32" />
    <text x="28" y="18" font-family="'DM Sans', system-ui, sans-serif" font-size="10" font-weight="700" fill="#242424" letter-spacing="0.5">SHOWER &amp; GYM SAFE</text>
  </g>

  <g transform="translate(225, 230)">
    <rect width="130" height="28" rx="8" fill="#FFFFFF" stroke="#E8E2D8" stroke-width="1" filter="url(#softShadow4)" />
    <circle cx="16" cy="14" r="5" fill="#C99716" />
    <text x="28" y="18" font-family="'DM Sans', system-ui, sans-serif" font-size="10" font-weight="700" fill="#242424" letter-spacing="0.5">3–4 WEEKS RETENTION</text>
  </g>
</svg>
