<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFAF7" />
      <stop offset="100%" stop-color="#FBF0CB" />
    </linearGradient>

    <!-- Clean Water / Hygiene Bubbles -->
    <linearGradient id="hygieneClean" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8F8F5" />
      <stop offset="100%" stop-color="#A3E4D7" />
    </linearGradient>

    <!-- Contour Tape Ribbon -->
    <linearGradient id="tapeRibbon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AC0D" />
      <stop offset="50%" stop-color="#F9E79F" />
      <stop offset="100%" stop-color="#B7950B" />
    </linearGradient>

    <filter id="softShadow6" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#554433" flood-opacity="0.12" />
    </filter>
  </defs>

  <rect width="400" height="280" rx="16" fill="url(#bgGrad6)" />
  <circle cx="200" cy="135" r="110" fill="#FFFFFF" fill-opacity="0.6" />

  <!-- Studio Styling Block Head / Mannequin Stand in Soft Ivory -->
  <g filter="url(#softShadow6)" transform="translate(140, 65)">
    <!-- Stand Base / Neck -->
    <ellipse cx="60" cy="140" rx="45" ry="12" fill="#E8DED1" stroke="#D1C3B2" stroke-width="1" />
    <path d="M 45 138 L 45 110 L 75 110 L 75 138 Z" fill="#E8DED1" />
    
    <!-- Stylist Mannequin Head Dome -->
    <ellipse cx="60" cy="75" rx="55" ry="60" fill="#F4EAE0" stroke="#DFCFC0" stroke-width="1.2" />

    <!-- Hair System Being Reconditioned on Stand -->
    <path d="M 12 75 Q 8 30 60 25 Q 112 30 108 75 Q 90 68 60 68 Q 30 68 12 75 Z" fill="#241C15" />
    
    <!-- Glossy Hair Conditioned Waves -->
    <g stroke="#423427" stroke-width="2.2" stroke-linecap="round" fill="none">
      <path d="M 22 70 Q 25 38 60 32" />
      <path d="M 38 68 Q 42 36 65 30" />
      <path d="M 58 67 Q 62 34 78 30" stroke="#5C4937" stroke-width="2.5" />
      <path d="M 78 68 Q 80 36 92 34" stroke="#5C4937" />
      <path d="M 95 72 Q 98 42 102 40" />
    </g>
  </g>

  <!-- Fresh Contour Tape Application (Peeling liner to reveal sterile medical tape) -->
  <g filter="url(#softShadow6)" transform="translate(210, 105)">
    <!-- Tape Strip with 3D Curve -->
    <path d="M 0 45 Q 40 20 85 40 Q 110 50 120 40 L 120 52 Q 105 65 80 55 Q 35 35 0 60 Z" fill="url(#tapeRibbon)" stroke="#B7950B" stroke-width="1" />
    <!-- Blue / White Peeling Liner Tab -->
    <path d="M 85 40 Q 105 20 125 15 L 122 25 Q 102 32 80 55 Z" fill="#EBF5FB" stroke="#AED6F1" stroke-width="0.8" />
    <text x="50" y="47" font-family="'DM Sans', system-ui, sans-serif" font-size="7.5" font-weight="800" fill="#242424">CONTOUR TAPE</text>
  </g>

  <!-- Hygiene Sparkles & Cleansing Micro-Droplets -->
  <g fill="#C99716">
    <!-- 4-Point Sparkle 1 -->
    <path d="M 120 70 Q 120 80 125 80 Q 120 80 120 90 Q 120 80 115 80 Q 120 80 120 70 Z" />
    <!-- 4-Point Sparkle 2 -->
    <path d="M 285 75 Q 285 83 289 83 Q 285 83 285 91 Q 285 83 281 83 Q 285 83 285 75 Z" opacity="0.8" />
    <!-- Sparkle 3 -->
    <path d="M 195 40 Q 195 46 198 46 Q 195 46 195 52 Q 195 46 192 46 Q 195 46 195 40 Z" opacity="0.9" />
  </g>

  <!-- Cleansing Bubbles / Scalp Exfoliation Representation -->
  <g fill="url(#hygieneClean)" stroke="#76D7C4" stroke-width="0.8" opacity="0.85">
    <circle cx="95" cy="115" r="8" /><circle cx="97" cy="113" r="2.5" fill="#FFFFFF" />
    <circle cx="112" cy="132" r="5" />
    <circle cx="85" cy="140" r="6" />
    <circle cx="105" cy="155" r="4.5" />
  </g>

  <!-- Service Timeline Label -->
  <g stroke="#C99716" stroke-width="1" opacity="0.9">
    <path d="M 285 150 L 330 150" stroke-dasharray="2 3" />
    <circle cx="285" cy="150" r="3" fill="#C99716" />
    <text x="335" y="153" font-family="'DM Sans', system-ui, sans-serif" font-size="9" font-weight="700" fill="#C99716">EVERY 25–30 DAYS</text>
  </g>

  <!-- Bottom Spec Badges -->
  <g transform="translate(45, 230)">
    <rect width="145" height="28" rx="8" fill="#FFFFFF" stroke="#E8E2D8" stroke-width="1" filter="url(#softShadow6)" />
    <circle cx="16" cy="14" r="5" fill="#2E7D32" />
    <text x="28" y="18" font-family="'DM Sans', system-ui, sans-serif" font-size="10" font-weight="700" fill="#242424" letter-spacing="0.5">SCALP DETOX &amp; CARE</text>
  </g>

  <g transform="translate(225, 230)">
    <rect width="130" height="28" rx="8" fill="#FFFFFF" stroke="#E8E2D8" stroke-width="1" filter="url(#softShadow6)" />
    <circle cx="16" cy="14" r="5" fill="#C99716" />
    <text x="28" y="18" font-family="'DM Sans', system-ui, sans-serif" font-size="10" font-weight="700" fill="#242424" letter-spacing="0.5">FRESH ADHESIVE</text>
  </g>
</svg>
