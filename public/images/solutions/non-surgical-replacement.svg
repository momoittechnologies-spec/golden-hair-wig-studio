<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFAF7" />
      <stop offset="100%" stop-color="#FBF0CB" />
    </linearGradient>

    <!-- Scalp Skin Tone Gradient -->
    <linearGradient id="scalpGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBEFE3" />
      <stop offset="50%" stop-color="#F2DEC9" />
      <stop offset="100%" stop-color="#E5CAAF" />
    </linearGradient>

    <!-- Swiss Lace Mesh Pattern -->
    <pattern id="swissLacePattern" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M 6 0 L 12 3.5 L 12 8.5 L 6 12 L 0 8.5 L 0 3.5 Z" fill="none" stroke="#DFB233" stroke-width="0.75" stroke-opacity="0.45" />
      <circle cx="6" cy="6" r="0.8" fill="#C99716" fill-opacity="0.5" />
    </pattern>

    <!-- Hair Strand Gradients -->
    <linearGradient id="hairDarkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A3026" />
      <stop offset="50%" stop-color="#1A1816" />
      <stop offset="100%" stop-color="#0E0C0B" />
    </linearGradient>
    <linearGradient id="hairHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6E5A44" />
      <stop offset="60%" stop-color="#2D241C" />
      <stop offset="100%" stop-color="#14110E" />
    </linearGradient>

    <!-- Gold Accent Glow -->
    <linearGradient id="goldSheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C99716" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#ECCB60" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#AB7B08" stop-opacity="0.2" />
    </linearGradient>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#554433" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="280" rx="16" fill="url(#bgGrad1)" />

  <!-- Subtle Radial Glow in Center -->
  <circle cx="200" cy="140" r="110" fill="#FFFFFF" fill-opacity="0.6" />

  <!-- Decorative Blueprint Grid Accent -->
  <circle cx="200" cy="145" r="90" fill="none" stroke="#E8E2D8" stroke-dasharray="3 4" stroke-width="1" />
  <circle cx="200" cy="145" r="118" fill="none" stroke="#E8E2D8" stroke-dasharray="2 6" stroke-width="0.75" />

  <!-- Scalp Layer Base (Anatomical representation) -->
  <g filter="url(#softShadow)">
    <path d="M 70 190 Q 200 135 330 190 L 330 220 Q 200 185 70 220 Z" fill="url(#scalpGrad1)" />
  </g>

  <!-- Swiss Lace Micro-Membrane Base Layer -->
  <g filter="url(#softShadow)">
    <path d="M 95 178 Q 200 138 305 178 Q 200 152 95 178 Z" fill="#F8EADB" fill-opacity="0.85" />
    <path d="M 95 178 Q 200 138 305 178 Q 200 152 95 178 Z" fill="url(#swissLacePattern)" />
    <!-- Undetectable Transition Border -->
    <path d="M 95 178 Q 200 138 305 178" fill="none" stroke="url(#goldSheen)" stroke-width="2.5" />
  </g>

  <!-- Follicular Hand-Knotting Nodes -->
  <g fill="#A88347" opacity="0.85">
    <circle cx="120" cy="172" r="1.5" /><circle cx="135" cy="167" r="1.5" /><circle cx="150" cy="162" r="1.5" />
    <circle cx="165" cy="158" r="1.5" /><circle cx="180" cy="154" r="1.5" /><circle cx="195" cy="152" r="1.5" />
    <circle cx="210" cy="153" r="1.5" /><circle cx="225" cy="155" r="1.5" /><circle cx="240" cy="159" r="1.5" />
    <circle cx="255" cy="164" r="1.5" /><circle cx="270" cy="169" r="1.5" /><circle cx="282" cy="173" r="1.5" />
  </g>

  <!-- Natural Hair Follicles Emerging Upward with Graceful Wave -->
  <g stroke-linecap="round" fill="none">
    <!-- Back Hair Density Layers -->
    <path d="M 115 172 Q 105 125 125 80 Q 140 50 160 40" stroke="url(#hairDarkGrad)" stroke-width="2.8" opacity="0.85" />
    <path d="M 130 168 Q 120 118 145 72 Q 165 42 190 35" stroke="url(#hairDarkGrad)" stroke-width="3" opacity="0.9" />
    <path d="M 145 163 Q 135 110 165 65 Q 185 38 215 32" stroke="url(#hairDarkGrad)" stroke-width="3.2" />
    <path d="M 160 159 Q 150 102 185 58 Q 210 32 240 28" stroke="url(#hairDarkGrad)" stroke-width="3.4" />
    <path d="M 175 155 Q 170 95 205 52 Q 235 28 265 26" stroke="url(#hairDarkGrad)" stroke-width="3.5" />
    <path d="M 190 153 Q 190 90 225 48 Q 255 26 285 28" stroke="url(#hairHighlight)" stroke-width="3.5" />
    <path d="M 205 153 Q 210 88 245 46 Q 275 26 305 32" stroke="url(#hairHighlight)" stroke-width="3.4" />
    <path d="M 220 155 Q 230 92 265 48 Q 295 32 320 42" stroke="url(#hairDarkGrad)" stroke-width="3.2" />
    <path d="M 235 158 Q 250 98 285 54 Q 315 40 330 58" stroke="url(#hairDarkGrad)" stroke-width="3" />
    <path d="M 250 163 Q 270 106 300 64 Q 325 50 338 72" stroke="url(#hairDarkGrad)" stroke-width="2.8" opacity="0.85" />
    <path d="M 265 168 Q 285 116 312 76" stroke="url(#hairDarkGrad)" stroke-width="2.5" opacity="0.75" />

    <!-- Delicate Micro-Fine Front Hairline Strands (Baby Hair / Natural Gradient Realism) -->
    <path d="M 135 167 Q 140 140 148 120" stroke="#4A3B2C" stroke-width="1.2" opacity="0.7" />
    <path d="M 155 161 Q 162 132 170 110" stroke="#4A3B2C" stroke-width="1.4" opacity="0.8" />
    <path d="M 175 156 Q 185 125 195 102" stroke="#4A3B2C" stroke-width="1.5" opacity="0.85" />
    <path d="M 195 153 Q 208 120 220 98" stroke="#5A4735" stroke-width="1.5" opacity="0.9" />
    <path d="M 215 154 Q 230 122 242 100" stroke="#5A4735" stroke-width="1.4" opacity="0.85" />
    <path d="M 235 158 Q 248 128 258 108" stroke="#4A3B2C" stroke-width="1.3" opacity="0.8" />
  </g>

  <!-- Technical Spec Callout Badge -->
  <g transform="translate(45, 230)">
    <rect width="138" height="28" rx="8" fill="#FFFFFF" stroke="#E8E2D8" stroke-width="1" filter="url(#softShadow)" />
    <circle cx="16" cy="14" r="5" fill="#C99716" />
    <text x="28" y="18" font-family="'DM Sans', system-ui, sans-serif" font-size="10" font-weight="700" fill="#242424" letter-spacing="0.5">SWISS LACE MATRIX</text>
  </g>

  <g transform="translate(225, 230)">
    <rect width="130" height="28" rx="8" fill="#FFFFFF" stroke="#E8E2D8" stroke-width="1" filter="url(#softShadow)" />
    <circle cx="16" cy="14" r="5" fill="#2E7D32" />
    <text x="28" y="18" font-family="'DM Sans', system-ui, sans-serif" font-size="10" font-weight="700" fill="#242424" letter-spacing="0.5">1-HOUR FIT</text>
  </g>
</svg>
