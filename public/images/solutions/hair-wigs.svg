<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="wigBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFAF7" />
      <stop offset="100%" stop-color="#F3ECE1" />
    </linearGradient>

    <!-- Mannequin Head Shading -->
    <linearGradient id="mannequinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDFB" />
      <stop offset="45%" stop-color="#F5EFE6" />
      <stop offset="100%" stop-color="#E4D7C5" />
    </linearGradient>

    <!-- Metallic Gold Stand -->
    <linearGradient id="standGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#96713B" />
      <stop offset="35%" stop-color="#D9B775" />
      <stop offset="70%" stop-color="#F2DEC9" />
      <stop offset="100%" stop-color="#8A6630" />
    </linearGradient>

    <!-- Hair Shading Gradients -->
    <linearGradient id="hairDarkBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#362C23" />
      <stop offset="40%" stop-color="#1C1814" />
      <stop offset="100%" stop-color="#0F0D0B" />
    </linearGradient>

    <linearGradient id="hairSilkSheen" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#2B221B" />
      <stop offset="30%" stop-color="#5C4B39" />
      <stop offset="60%" stop-color="#8E785C" />
      <stop offset="85%" stop-color="#3A3026" />
      <stop offset="100%" stop-color="#151311" />
    </linearGradient>

    <linearGradient id="silkScalp" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCEEE2" />
      <stop offset="100%" stop-color="#EED5BE" />
    </linearGradient>

    <filter id="wigDropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#4A3828" flood-opacity="0.14" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="280" rx="16" fill="url(#wigBgGrad)" />

  <!-- Soft Ambient Backdrop Circles -->
  <circle cx="200" cy="135" r="95" fill="#FFFFFF" fill-opacity="0.65" />
  <circle cx="200" cy="135" r="115" fill="none" stroke="#E8E2D8" stroke-dasharray="3 4" stroke-width="1" />

  <!-- Studio Pedestal Base -->
  <g filter="url(#wigDropShadow)">
    <!-- Base Plate -->
    <ellipse cx="200" cy="245" rx="52" ry="10" fill="url(#standGold)" />
    <ellipse cx="200" cy="242" rx="46" ry="7" fill="#FAF6F0" opacity="0.6" />
    <!-- Stand Pillar -->
    <rect x="196" y="195" width="8" height="50" rx="3" fill="url(#standGold)" />
  </g>

  <!-- Mannequin Bust & Neck -->
  <path d="M 172 205 C 172 178 182 165 186 150 L 214 150 C 218 165 228 178 228 205 Z" fill="url(#mannequinGrad)" />
  <!-- Head Silhouette -->
  <path d="M 148 115 C 148 68 172 45 200 45 C 228 45 252 68 252 115 C 252 152 232 170 200 170 C 168 170 148 152 148 115 Z" fill="url(#mannequinGrad)" />

  <!-- Wig Hair Layers (Full Cap Volume & Natural Flow) -->
  <g filter="url(#wigDropShadow)">
    <!-- Back Hair Mass (Long flowing lengths behind neck) -->
    <path d="M 142 105 C 130 145 132 185 145 228 C 152 232 165 235 178 232 C 170 195 172 150 175 110 Z" fill="url(#hairDarkBase)" />
    <path d="M 258 105 C 270 145 268 185 255 228 C 248 232 235 235 222 232 C 230 195 228 150 225 110 Z" fill="url(#hairDarkBase)" />

    <!-- Full Crown Cap Contour -->
    <path d="M 140 102 C 140 50 168 34 200 34 C 232 34 260 50 260 102 C 260 140 252 175 256 220 C 248 224 238 220 236 200 C 232 160 230 135 230 105 C 215 105 185 105 170 105 C 170 135 168 160 164 200 C 162 220 152 224 144 220 C 148 175 140 140 140 102 Z" fill="url(#hairSilkSheen)" />

    <!-- Multi-directional Silk Scalp Parting (Center-Left) -->
    <path d="M 194 40 C 196 60 195 82 193 100" stroke="url(#silkScalp)" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 194 40 C 196 60 195 82 193 100" stroke="#FCEEE2" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="1 2" opacity="0.8" />

    <!-- Soft Face Framing & Lustrous Waves -->
    <path d="M 194 42 C 175 48 150 68 144 112 C 140 142 148 180 155 215" fill="none" stroke="url(#hairSilkSheen)" stroke-width="9" stroke-linecap="round" />
    <path d="M 196 42 C 218 48 248 68 256 112 C 260 142 252 180 245 215" fill="none" stroke="url(#hairSilkSheen)" stroke-width="9" stroke-linecap="round" />

    <!-- Fine Hair Strands & Shine Highlights -->
    <path d="M 194 44 Q 165 58 156 100 Q 150 135 158 190" fill="none" stroke="#8E785C" stroke-width="1.5" opacity="0.65" />
    <path d="M 194 44 Q 170 70 165 120 Q 162 160 168 210" fill="none" stroke="#D9B775" stroke-width="0.75" opacity="0.45" />
    <path d="M 196 44 Q 225 58 238 98 Q 248 135 240 195" fill="none" stroke="#8E785C" stroke-width="1.5" opacity="0.65" />
    <path d="M 196 44 Q 220 70 226 120 Q 230 160 224 210" fill="none" stroke="#D9B775" stroke-width="0.75" opacity="0.45" />

    <!-- Natural Temple Swirl & Soft Baby Hair Edge -->
    <path d="M 162 92 Q 158 98 163 104" fill="none" stroke="#362C23" stroke-width="1" stroke-linecap="round" />
    <path d="M 238 92 Q 242 98 237 104" fill="none" stroke="#362C23" stroke-width="1" stroke-linecap="round" />
  </g>

  <!-- Technical Callout Cards -->
  <!-- Top Left: Silk-Top Parting -->
  <g transform="translate(18, 48)">
    <rect width="112" height="34" rx="8" fill="#FFFFFF" stroke="#E8E2D8" stroke-width="1" filter="url(#wigDropShadow)" />
    <circle cx="14" cy="17" r="4.5" fill="#B58D4A" />
    <text x="26" y="15" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#242424">Silk-Top Crown</text>
    <text x="26" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#6B6258">Multi-way parting</text>
    <line x1="112" y1="17" x2="160" y2="52" stroke="#B58D4A" stroke-width="1" stroke-dasharray="2 3" opacity="0.8" />
    <circle cx="160" cy="52" r="2.5" fill="#B58D4A" />
  </g>

  <!-- Bottom Right: 100% Virgin Hair Tag -->
  <g transform="translate(268, 178)">
    <rect width="115" height="34" rx="8" fill="#FFFFFF" stroke="#E8E2D8" stroke-width="1" filter="url(#wigDropShadow)" />
    <circle cx="14" cy="17" r="4.5" fill="#B58D4A" />
    <text x="26" y="15" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#242424">100% Human Hair</text>
    <text x="26" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#6B6258">Heat-stylable &amp; soft</text>
    <line x1="0" y1="17" x2="-25" y2="-10" stroke="#B58D4A" stroke-width="1" stroke-dasharray="2 3" opacity="0.8" />
    <circle cx="-25" cy="-10" r="2.5" fill="#B58D4A" />
  </g>

  <!-- Bottom Center Pill Badge -->
  <g transform="translate(115, 252)">
    <rect width="170" height="20" rx="10" fill="#FAF8F4" stroke="#D3B896" stroke-width="0.8" />
    <text x="85" y="14" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#96713B" text-anchor="middle">
      FULL CAP COMFORT • AIR-MESH BASE
    </text>
  </g>
</svg>