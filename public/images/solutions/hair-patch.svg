<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFAF7" />
      <stop offset="100%" stop-color="#F3ECE1" />
    </linearGradient>

    <!-- Base Membrane Gradient -->
    <radialGradient id="patchBaseGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDF6ED" stop-opacity="0.9" />
      <stop offset="75%" stop-color="#F2DFCA" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#D4BA9E" stop-opacity="0.9" />
    </radialGradient>

    <!-- Hair Shading -->
    <radialGradient id="whorlGrad" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#473628" />
      <stop offset="50%" stop-color="#211A14" />
      <stop offset="100%" stop-color="#0F0C0A" />
    </radialGradient>

    <filter id="softShadow3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#554433" flood-opacity="0.12" />
    </filter>
  </defs>

  <rect width="400" height="280" rx="16" fill="url(#bgGrad3)" />
  <circle cx="200" cy="135" r="110" fill="#FFFFFF" fill-opacity="0.6" />

  <!-- Caliper Measurement Rulers / Axis lines -->
  <ellipse cx="200" cy="135" rx="130" ry="85" fill="none" stroke="#E8E2D8" stroke-dasharray="3 4" stroke-width="1" />
  <line x1="200" y1="35" x2="200" y2="235" stroke="#E8E2D8" stroke-dasharray="2 4" stroke-width="0.75" />
  <line x1="60" y1="135" x2="340" y2="135" stroke="#E8E2D8" stroke-dasharray="2 4" stroke-width="0.75" />

  <!-- The Custom Hair Patch Unit in 3D Perspective -->
  <g filter="url(#softShadow3)">
    <!-- Base Outer Polyurethane Perimeter Rim -->
    <ellipse cx="200" cy="135" rx="105" ry="68" fill="url(#patchBaseGrad)" stroke="#B58D4A" stroke-width="2" />
    
    <!-- Micro-Perforations for Scalp Breathability -->
    <g fill="#A88B68" opacity="0.4">
      <circle cx="150" cy="115" r="1.2" /><circle cx="170" cy="110" r="1.2" /><circle cx="190" cy="108" r="1.2" /><circle cx="210" cy="108" r="1.2" /><circle cx="230" cy="112" r="1.2" /><circle cx="250" cy="118" r="1.2" />
      <circle cx="140" cy="130" r="1.2" /><circle cx="160" cy="128" r="1.2" /><circle cx="180" cy="125" r="1.2" /><circle cx="220" cy="126" r="1.2" /><circle cx="240" cy="130" r="1.2" /><circle cx="260" cy="135" r="1.2" />
      <circle cx="150" cy="148" r="1.2" /><circle cx="170" cy="145" r="1.2" /><circle cx="190" cy="142" r="1.2" /><circle cx="210" cy="143" r="1.2" /><circle cx="230" cy="146" r="1.2" /><circle cx="250" cy="150" r="1.2" />
    </g>

    <!-- Natural Hair Volume Radiating from Crown Swirl (Whorl) -->
    <!-- Central Swirl Point at (190, 125) -->
    <g fill="none" stroke-linecap="round">
      <!-- Radiating Hair Arcs mimicking natural cowlick swirl -->
      <!-- Top Left -->
      <path d="M 190 125 Q 170 110 145 95 Q 120 80 95 90" stroke="url(#whorlGrad)" stroke-width="3" />
      <path d="M 190 125 Q 175 102 155 82 Q 135 65 115 70" stroke="url(#whorlGrad)" stroke-width="3.2" />
      <path d="M 190 125 Q 185 95 170 70 Q 155 50 135 52" stroke="url(#whorlGrad)" stroke-width="3" />

      <!-- Top Right -->
      <path d="M 190 125 Q 200 95 215 72 Q 235 50 260 55" stroke="url(#whorlGrad)" stroke-width="3" />
      <path d="M 190 125 Q 215 100 240 78 Q 268 60 295 72" stroke="url(#whorlGrad)" stroke-width="3.2" />
      <path d="M 190 125 Q 225 110 260 92 Q 290 85 315 102" stroke="url(#whorlGrad)" stroke-width="3.4" />

      <!-- Right & Bottom Right -->
      <path d="M 190 125 Q 230 128 268 120 Q 300 118 322 135" stroke="url(#whorlGrad)" stroke-width="3.5" />
      <path d="M 190 125 Q 225 142 260 148 Q 288 152 308 170" stroke="url(#whorlGrad)" stroke-width="3.4" />
      <path d="M 190 125 Q 215 152 240 170 Q 260 185 278 202" stroke="url(#whorlGrad)" stroke-width="3.2" />

      <!-- Bottom & Bottom Left -->
      <path d="M 190 125 Q 195 160 205 185 Q 212 208 220 220" stroke="url(#whorlGrad)" stroke-width="3.2" />
      <path d="M 190 125 Q 180 160 175 185 Q 170 208 165 220" stroke="url(#whorlGrad)" stroke-width="3" />
      <path d="M 190 125 Q 165 152 145 172 Q 130 190 118 205" stroke="url(#whorlGrad)" stroke-width="3.2" />

      <!-- Left & Center Swirl Texture -->
      <path d="M 190 125 Q 155 140 125 145 Q 98 148 85 135" stroke="url(#whorlGrad)" stroke-width="3.4" />
      <path d="M 190 125 Q 160 125 132 122 Q 105 118 90 112" stroke="url(#whorlGrad)" stroke-width="3.2" />

      <!-- Delicate Highlights -->
      <path d="M 190 125 Q 210 115 245 100 Q 275 92 305 105" stroke="#7A614A" stroke-width="1.6" opacity="0.8" />
      <path d="M 190 125 Q 175 135 150 148 Q 125 158 105 172" stroke="#7A614A" stroke-width="1.6" opacity="0.8" />
      <path d="M 190 125 Q 198 108 215 88 Q 235 70 258 68" stroke="#7A614A" stroke-width="1.6" opacity="0.8" />
    </g>

    <!-- Natural Crown Swirl Center Dot -->
    <circle cx="190" cy="125" r="3.5" fill="#140F0C" />
    <circle cx="190" cy="125" r="1.5" fill="#B58D4A" />
  </g>

  <!-- Caliper Dimension Spec Indicators -->
  <g stroke="#B58D4A" stroke-width="1" opacity="0.9">
    <!-- Horizontal Width Arrow -->
    <path d="M 95 210 L 305 210" stroke-dasharray="3 3" />
    <path d="M 95 205 L 95 215" /><path d="M 305 205 L 305 215" />
    <text x="200" y="222" font-family="'DM Sans', system-ui, sans-serif" font-size="9" font-weight="700" fill="#B58D4A" text-anchor="middle">CUSTOM CROWN PERIMETER</text>
  </g>

  <!-- Bottom Spec Badges -->
  <g transform="translate(45, 235)">
    <rect width="145" height="28" rx="8" fill="#FFFFFF" stroke="#E8E2D8" stroke-width="1" filter="url(#softShadow3)" />
    <circle cx="16" cy="14" r="5" fill="#B58D4A" />
    <text x="28" y="18" font-family="'DM Sans', system-ui, sans-serif" font-size="10" font-weight="700" fill="#242424" letter-spacing="0.5">360° CROWN WHORL</text>
  </g>

  <g transform="translate(225, 235)">
    <rect width="130" height="28" rx="8" fill="#FFFFFF" stroke="#E8E2D8" stroke-width="1" filter="url(#softShadow3)" />
    <circle cx="16" cy="14" r="5" fill="#2E7D32" />
    <text x="28" y="18" font-family="'DM Sans', system-ui, sans-serif" font-size="10" font-weight="700" fill="#242424" letter-spacing="0.5">SWISS BASE</text>
  </g>
</svg>
