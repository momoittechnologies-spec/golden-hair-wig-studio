<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFAF7" />
      <stop offset="100%" stop-color="#F3ECE1" />
    </linearGradient>

    <linearGradient id="mannequinSkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E8D8" />
      <stop offset="50%" stop-color="#EADBCA" />
      <stop offset="100%" stop-color="#D9C6B0" />
    </linearGradient>

    <linearGradient id="maleHairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#36291E" />
      <stop offset="60%" stop-color="#1A1511" />
      <stop offset="100%" stop-color="#0E0B09" />
    </linearGradient>

    <linearGradient id="fadeShading" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0E0B09" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#4A3A2C" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#D9C6B0" stop-opacity="0" />
    </linearGradient>

    <filter id="softShadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#554433" flood-opacity="0.12" />
    </filter>
  </defs>

  <rect width="400" height="280" rx="16" fill="url(#bgGrad2)" />
  <circle cx="200" cy="140" r="110" fill="#FFFFFF" fill-opacity="0.6" />

  <!-- Precision Measurement Guides / Alignment Circles -->
  <circle cx="200" cy="140" r="95" fill="none" stroke="#E8E2D8" stroke-dasharray="3 4" stroke-width="1" />
  <line x1="90" y1="140" x2="310" y2="140" stroke="#E8E2D8" stroke-dasharray="2 4" stroke-width="0.75" />

  <!-- Male Head Contour Profile (Clean Editorial Stylized Mannequin) -->
  <g filter="url(#softShadow2)">
    <!-- Head Base / Neck / Jawline / Ear -->
    <path d="M 120 230 L 130 185 Q 140 160 160 155 Q 165 145 160 130 Q 155 115 165 105 Q 185 85 220 85 Q 260 85 275 115 Q 285 135 280 165 Q 275 190 260 210 L 265 230 Z" fill="url(#mannequinSkin)" opacity="0.95" />
    
    <!-- Anatomical Ear Shape -->
    <path d="M 160 145 Q 150 150 152 165 Q 155 178 168 175 Q 172 160 160 145 Z" fill="#E2CFBB" stroke="#D1BCA6" stroke-width="1" />
    <path d="M 156 155 Q 154 162 160 165" fill="none" stroke="#BFA890" stroke-width="1" />
  </g>

  <!-- High-Precision Taper Fade Shading along Sideburn and Neck -->
  <path d="M 150 178 Q 165 180 180 182 L 180 205 Q 155 200 145 188 Z" fill="url(#fadeShading)" />
  <path d="M 155 142 L 160 125 Q 170 120 178 128 L 175 148 Q 165 144 155 142 Z" fill="url(#fadeShading)" />

  <!-- Hand-Crafted Voluminous Pompadour / Modern Quiff Hair System -->
  <g filter="url(#softShadow2)">
    <!-- Base Hair Volume Mass -->
    <path d="M 160 115 Q 155 85 175 60 Q 200 35 240 38 Q 280 42 295 75 Q 305 100 290 125 Q 275 115 255 112 Q 225 110 200 112 Q 180 114 160 115 Z" fill="url(#maleHairGrad)" />

    <!-- Individual Hair Crest Styling Strokes -->
    <path d="M 165 110 Q 165 75 190 52 Q 220 32 255 36" fill="none" stroke="#4D3B2D" stroke-width="2.2" stroke-linecap="round" />
    <path d="M 175 105 Q 178 72 205 48 Q 235 30 270 38" fill="none" stroke="#5E4937" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 190 102 Q 195 68 222 45 Q 252 28 285 45" fill="none" stroke="#5E4937" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 210 102 Q 215 65 242 45 Q 270 32 295 55" fill="none" stroke="#4D3B2D" stroke-width="2" stroke-linecap="round" />
    <path d="M 230 105 Q 240 70 265 52 Q 288 45 302 70" fill="none" stroke="#3D2E22" stroke-width="2" stroke-linecap="round" />

    <!-- Front Hairline Undetectable Texture Gradient -->
    <path d="M 270 110 Q 285 95 292 78" fill="none" stroke="#66503D" stroke-width="1.8" stroke-linecap="round" />
    <path d="M 260 112 Q 272 100 280 88" fill="none" stroke="#66503D" stroke-width="1.6" stroke-linecap="round" />
    <path d="M 248 113 Q 258 104 266 94" fill="none" stroke="#523F2E" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Technical Caliper Contour Markers -->
  <g stroke="#B58D4A" stroke-width="1.2" opacity="0.85">
    <!-- Frontal Angle Indicator -->
    <circle cx="282" cy="116" r="3" fill="#B58D4A" />
    <path d="M 282 116 L 330 105" stroke-dasharray="2 3" />
    <text x="335" y="108" font-family="'DM Sans', system-ui, sans-serif" font-size="9" font-weight="700" fill="#B58D4A">NATURAL RECESSION</text>

    <!-- Sideburn Blend Indicator -->
    <circle cx="160" cy="140" r="3" fill="#B58D4A" />
    <path d="M 160 140 L 95 130" stroke-dasharray="2 3" />
    <text x="50" y="133" font-family="'DM Sans', system-ui, sans-serif" font-size="9" font-weight="700" fill="#B58D4A">FADE BLEND</text>
  </g>

  <!-- Bottom Spec Pills -->
  <g transform="translate(45, 230)">
    <rect width="145" height="28" rx="8" fill="#FFFFFF" stroke="#E8E2D8" stroke-width="1" filter="url(#softShadow2)" />
    <circle cx="16" cy="14" r="5" fill="#B58D4A" />
    <text x="28" y="18" font-family="'DM Sans', system-ui, sans-serif" font-size="10" font-weight="700" fill="#242424" letter-spacing="0.5">CUSTOM FADE CUT</text>
  </g>

  <g transform="translate(225, 230)">
    <rect width="130" height="28" rx="8" fill="#FFFFFF" stroke="#E8E2D8" stroke-width="1" filter="url(#softShadow2)" />
    <circle cx="16" cy="14" r="5" fill="#B58D4A" />
    <text x="28" y="18" font-family="'DM Sans', system-ui, sans-serif" font-size="10" font-weight="700" fill="#242424" letter-spacing="0.5">REMY VIRGIN HAIR</text>
  </g>
</svg>
