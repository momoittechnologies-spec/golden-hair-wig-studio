<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFAF7" />
      <stop offset="100%" stop-color="#FBF0CB" />
    </linearGradient>

    <!-- Clip Steel Gradient -->
    <linearGradient id="clipSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A4A4A" />
      <stop offset="50%" stop-color="#2D2D2D" />
      <stop offset="100%" stop-color="#1A1A1A" />
    </linearGradient>

    <!-- Silicone Cushion Gradient -->
    <linearGradient id="siliconeCushion" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AC0D" />
      <stop offset="50%" stop-color="#F1C40F" />
      <stop offset="100%" stop-color="#B7950B" />
    </linearGradient>

    <filter id="softShadow5" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#554433" flood-opacity="0.12" />
    </filter>
  </defs>

  <rect width="400" height="280" rx="16" fill="url(#bgGrad5)" />
  <circle cx="200" cy="135" r="110" fill="#FFFFFF" fill-opacity="0.6" />

  <!-- Base Rim Representation in Background -->
  <ellipse cx="200" cy="135" rx="125" ry="75" fill="none" stroke="#E8E2D8" stroke-dasharray="3 4" stroke-width="1.2" />

  <!-- Underside Base Outline (Partial Arc) -->
  <path d="M 60 170 Q 200 90 340 170" fill="none" stroke="#D3C3B2" stroke-width="18" stroke-linecap="round" opacity="0.6" />

  <!-- Miniature clips distributed along perimeter -->
  <g transform="translate(85, 142) rotate(-25) scale(0.45)">
    <rect width="60" height="30" rx="6" fill="#333" />
    <rect x="5" y="8" width="50" height="8" rx="2" fill="#E67E22" />
  </g>
  <g transform="translate(305, 142) rotate(25) scale(0.45)">
    <rect width="60" height="30" rx="6" fill="#333" />
    <rect x="5" y="8" width="50" height="8" rx="2" fill="#E67E22" />
  </g>
  <g transform="translate(190, 95) scale(0.45)">
    <rect width="60" height="30" rx="6" fill="#333" />
    <rect x="5" y="8" width="50" height="8" rx="2" fill="#E67E22" />
  </g>

  <!-- Macro Focal Point: Large Precision Micro-Clip in Center -->
  <g filter="url(#softShadow5)" transform="translate(130, 95)">
    <!-- Clip Outer Frame Body (Lightweight spring steel) -->
    <rect x="0" y="0" width="140" height="75" rx="12" fill="url(#clipSteel)" stroke="#666" stroke-width="1.5" />

    <!-- Sewing / Fastener Eyelets (Anchored to System Base) -->
    <circle cx="15" cy="16" r="4.5" fill="#222" stroke="#888" stroke-width="1" />
    <circle cx="125" cy="16" r="4.5" fill="#222" stroke="#888" stroke-width="1" />
    <circle cx="15" cy="59" r="4.5" fill="#222" stroke="#888" stroke-width="1" />
    <circle cx="125" cy="59" r="4.5" fill="#222" stroke="#888" stroke-width="1" />

    <!-- Medical-Grade Protective Silicone Comfort Cushion Bar -->
    <rect x="25" y="22" width="90" height="15" rx="4" fill="url(#siliconeCushion)" />
    <text x="70" y="33" font-family="'DM Sans', system-ui, sans-serif" font-size="7.5" font-weight="800" fill="#242424" text-anchor="middle" letter-spacing="0.5">SILICONE GRIP</text>

    <!-- Snap Comb Teeth (Pressure Grip Teeth) -->
    <g fill="#555" stroke="#222" stroke-width="0.8">
      <path d="M 32 40 L 38 64 L 42 64 L 38 40 Z" />
      <path d="M 46 40 L 52 64 L 56 64 L 52 40 Z" />
      <path d="M 60 40 L 66 64 L 70 64 L 66 40 Z" />
      <path d="M 74 40 L 80 64 L 84 64 L 80 40 Z" />
      <path d="M 88 40 L 94 64 L 98 64 L 94 40 Z" />
      <path d="M 102 40 L 108 64 L 112 64 L 108 40 Z" />
    </g>

    <!-- Natural Hair Strands Being Gently Interlocked -->
    <g stroke="#1A1511" stroke-width="1.8" fill="none" opacity="0.85">
      <path d="M 35 78 Q 40 60 42 35 Q 44 15 40 0" />
      <path d="M 54 78 Q 56 60 58 35 Q 60 15 58 0" />
      <path d="M 68 78 Q 70 60 72 35 Q 74 15 72 0" />
      <path d="M 82 78 Q 84 60 86 35 Q 88 15 86 0" />
      <path d="M 96 78 Q 98 60 100 35 Q 102 15 100 0" />
      <path d="M 110 78 Q 112 60 114 35 Q 116 15 114 0" />
    </g>
  </g>

  <!-- Zero-Damage Hair Safety Callout -->
  <g stroke="#C99716" stroke-width="1" opacity="0.9">
    <path d="M 70 100 L 125 115" stroke-dasharray="2 3" />
    <circle cx="70" cy="100" r="3" fill="#C99716" />
    <text x="35" y="96" font-family="'DM Sans', system-ui, sans-serif" font-size="9" font-weight="700" fill="#C99716">NO ADHESIVE</text>
  </g>

  <!-- Bottom Spec Badges -->
  <g transform="translate(45, 230)">
    <rect width="145" height="28" rx="8" fill="#FFFFFF" stroke="#E8E2D8" stroke-width="1" filter="url(#softShadow5)" />
    <circle cx="16" cy="14" r="5" fill="#C99716" />
    <text x="28" y="18" font-family="'DM Sans', system-ui, sans-serif" font-size="10" font-weight="700" fill="#242424" letter-spacing="0.5">DAILY SELF-REMOVE</text>
  </g>

  <g transform="translate(225, 230)">
    <rect width="130" height="28" rx="8" fill="#FFFFFF" stroke="#E8E2D8" stroke-width="1" filter="url(#softShadow5)" />
    <circle cx="16" cy="14" r="5" fill="#2E7D32" />
    <text x="28" y="18" font-family="'DM Sans', system-ui, sans-serif" font-size="10" font-weight="700" fill="#242424" letter-spacing="0.5">ZERO SCALP GLUE</text>
  </g>
</svg>
